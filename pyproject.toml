[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::agent_framework._feature_stage.ExperimentalWarning",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = [
    "banking_agent.py", "demo.py", "demo_output.py", "main.py",
    "remote_demo.py", "scenarios.py", "tests",
]
