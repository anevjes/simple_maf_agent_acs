# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: banking-acs-demo
requiredVersions:
  azd: ">=1.36.0"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
services:
  ai-project:
    host: azure.ai.project
  banking-acs-demo:
    host: azure.ai.agent
    project: .
    language: python
    kind: hosted
    name: banking-acs-demo
    description: Simulated banking with native MAF Agent Hooks and ACS policy enforcement.
    uses:
      - ai-project
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
      dependencyResolution: remote_build
    protocols:
      - protocol: responses
        version: 2.0.0
    environmentVariables:
      - name: PYTHONNOUSERSITE
        value: "1"
      - name: BANKING_MODE
        value: foundry
      - name: FOUNDRY_PROJECT_ENDPOINT
        value: ${AZURE_AI_PROJECT_ENDPOINT}
      - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
        value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
    container:
      resources:
        cpu: "1"
        memory: 2Gi
infra:
  provider: microsoft.foundry
